# Nombre aplicación
spring:
  application:
    name: backend

  config:
    import: "optional:file:./mapAlertBackend/.env"  

  # Desactiva solo seguridad si es necesario
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  # MySQL - CONEXIÓN COMPLETA
  datasource:
    url: jdbc:mysql://localhost:3306/mapAlert?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: cuchitril
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # JPA Config
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

jwt:
  secret: bXlTdXBlclNlY3JldEtleVBhcmFKV1RRdWVUaWVuZU1hc0RlMzJDaGFyYWN0ZXJz
  expiration-ms: 86400000  # 24 horas
  refresh-token:
    expiration: 604800000

# Server
server:
  port: 8080

# Umbral de votos para desactivar un reporte
reporte:
  votos:
    umbral-desactivacion: 3